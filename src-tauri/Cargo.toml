[package]
name = "offlinecraft"
version = "3.0.0"
description = "OfflineCraft - offline Minecraft launcher (Tauri)"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip", "deflate"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
url = "2"
percent-encoding = "2"
regex = "1"
walkdir = "2"
hickory-resolver = "0.24"
local-ip-address = "0.6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
panic = "abort"
